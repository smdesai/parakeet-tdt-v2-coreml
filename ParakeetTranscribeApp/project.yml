name: ParakeetTranscribe
options:
  bundleIdPrefix: com.sdesai
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_LANGUAGE: en
    # Personal team (Apple Development: Sachin Desai). Set here so it survives
    # `xcodegen generate`.
    DEVELOPMENT_TEAM: TA92TEWDS4

# The transcription core + Hugging Face downloader live in the local ParakeetKit
# SPM package (repo-root sibling), shared verbatim with the parakeet-transcribe
# CLI so there is a single source of truth. Consumed by relative path.
packages:
  ParakeetKit:
    path: ../ParakeetKit

targets:
  ParakeetTranscribe:
    type: application
    platform: iOS
    deploymentTarget: "27.0"
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
      # NOTE: The ~620 MB Parakeet-TDT-v2 CoreML models are no longer bundled
      # into the app. They are downloaded from Hugging Face
      # (smdesai/parakeet-tdt-0.6b-v2-coreml) into Application Support on first
      # launch by ParakeetDownload's ModelDownloader. The former
      # `Resources/Models` (type: folder) resource entry has been removed so the
      # models are not copied into the bundle. The on-disk Resources/Models
      # directory is intentionally left in place (it is simply no longer
      # referenced by the build).
    dependencies:
      - package: ParakeetKit
        product: ParakeetCore
      - package: ParakeetKit
        product: ParakeetDownload
    scheme:
      # Pure-logic tests (ModelDownloader planning, WindowPlanner) now live in the
      # ParakeetKit package and run via `swift test`; the app no longer hosts an
      # XCTest bundle.
      gatherCoverageData: false
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Parakeet
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: >-
          Parakeet uses the microphone to record speech, which is transcribed
          entirely on-device. Audio is never uploaded.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sdesai.ParakeetTranscribe
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SWIFT_VERSION: "5.0"
