name: ParakeetTranscribe
options:
  bundleIdPrefix: com.sdesai
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_LANGUAGE: en
    # Personal team (Apple Development: Sachin Desai). Set here so it survives
    # `xcodegen generate`.
    DEVELOPMENT_TEAM: TA92TEWDS4

targets:
  ParakeetTranscribe:
    type: application
    platform: iOS
    deploymentTarget: "27.0"
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
      # Bundled Parakeet-TDT-v2 CoreML models (INT8 encoder pipeline). Staged by
      # scripts/stage-models.sh into Resources/Models as compiled .mlmodelc +
      # parakeet_vocab.json. `type: folder` adds a folder reference so the tree
      # is copied verbatim into the app bundle (no runtime download).
      - path: Resources/Models
        type: folder
        buildPhase: resources
    scheme:
      testTargets: []
      gatherCoverageData: false
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Parakeet
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: >-
          Parakeet uses the microphone to record speech, which is transcribed
          entirely on-device. Audio is never uploaded.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sdesai.ParakeetTranscribe
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SWIFT_VERSION: "5.0"
